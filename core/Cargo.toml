[package]
name = "yui-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3" # MessagePack
rmpv = { version = "1.3", features = ["with-serde"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" } # serde_yaml is deprecated; serde_yaml_ng is the maintained drop-in fork
regex = "1.11"
log = "0.4"
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.14"
rayon = "1.12"
tokio = { version = "1", features = ["full"] }
# proteindf-bridge release tag containing §3.14 (AtomGroup::setup()) and mmCIF export.
proteindf-bridge = { git = "https://github.com/ProteinDF/ProteinDF_bridge.git", tag = "2026.10.20", default-features = false, features = ["zstd"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# proteindf-bridge release tag containing §3.14 (AtomGroup::setup()) and mmCIF export.
proteindf-bridge = { git = "https://github.com/ProteinDF/ProteinDF_bridge.git", tag = "2026.10.20", default-features = false, features = ["ruzstd"] }
